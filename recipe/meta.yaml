{% set version = "0.7.0" %}

package:
  name: fastplotlib
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/f/fastplotlib/fastplotlib-{{ version }}.tar.gz
  sha256: 6c77270ddb7480454c36384a4c178d5c12f1eccb37414ca547723f48a8361ac0
  patches:
    - 0001-loosen-pygfx-pin.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - wheel
    - pip
    - flit-core
  run:
    - python >={{ python_min }}
    - numpy >=2.1.0
    - wgpu-py >=0.20.0
    - pygfx >=0.17.0
    - cmap >=0.1.3

test:
  # Tests are in the run_test.py file
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/fastplotlib/fastplotlib
  summary: A fast plotting library built using the pygfx render engine
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
